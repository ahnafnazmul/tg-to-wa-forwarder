name: Hourly Tender Forwarder Workflow

on:
  schedule:
    - cron: '0 * * * *'  # প্রতি ঘণ্টায় অটো রান হবে
  workflow_dispatch:      # ম্যানুয়ালি রান করার বাটন

jobs:
  run-forwarder:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install Dependencies
        run: npm install

      - name: Run Engine
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
          TARGET_BOT_IDS: ${{ secrets.TARGET_BOT_IDS }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          WA_CHANNEL_JID: ${{ secrets.WA_CHANNEL_JID }}
        run: node index.js
